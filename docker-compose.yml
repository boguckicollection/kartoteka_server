version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]

  ngrok:
    image: ngrok/ngrok:alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "app:8000", "--log=stdout"]
    ports:
      - "4040:4040"
    links:
      - app
